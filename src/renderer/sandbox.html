<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandboxes</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./window.css" />
  </head>
  <body>
    <div id="backdrop" class="backdrop">
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
        <header class="dialog-header">
          <h1 id="title">Sandboxes</h1>
          <div class="header-actions">
            <button id="refresh" class="button" type="button">Refresh</button>
            <button id="close" class="button icon" type="button" aria-label="Close">✕</button>
          </div>
        </header>

        <div class="dialog-body">
          <p id="notice" class="notice" hidden></p>
          <div id="list"></div>
        </div>
      </section>
    </div>

    <script type="module" src="./sandbox.ts"></script>
  </body>
</html>
