<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH sbx client</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <nav class="menubar" aria-label="Menu">
        <button class="menu-button" type="button" data-menu="application">Application</button>
        <button class="menu-button" type="button" data-menu="view">View</button>
      </nav>
    </header>

    <form id="toolbar" class="toolbar" autocomplete="off">
      <input
        id="url"
        class="input url"
        type="text"
        spellcheck="false"
        aria-label="Address of the DSH web UI"
        placeholder="http://127.0.0.1:3080/"
      />
      <button id="primary" class="button primary" type="submit">Connect</button>
      <button id="sign-out" class="button" type="button" hidden>Sign out</button>
      <span class="separator" aria-hidden="true"></span>
      <button id="open-sandboxes" class="button" type="button">Sandboxes</button>
      <button id="open-settings" class="button" type="button">Settings</button>
    </form>

    <main id="panel" class="panel">
      <h1 id="panel-title"></h1>
      <p id="panel-text"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
